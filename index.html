      #renderCanvas {

      /* Story 4.1 — instant inline splash (critical CSS; paints before the
         runtime chunk arrives). The runtime feedback surface ADOPTS this
         container (same node) for the loading overlay + error card. Themeable
         via the --webverse-feedback-* custom properties (the default surface
         is private/swappable — embedders opt out — so the webverse- naming is
         the allowed implementation-identifier exception, like the log prefix). */
      #webverse-feedback {
        position: fixed;
        inset: 0;
        z-index: 10; /* below the debug HUD (20) */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--webverse-feedback-bg, #101014);
        color: var(--webverse-feedback-fg, #dfe3ea);
        font: 14px/1.5 system-ui, sans-serif;
        text-align: center;
        pointer-events: none; /* never eat canvas input; buttons re-enable */
      }
      #webverse-feedback[data-webverse-feedback-state='hidden'] {
        display: none;
      }
      #webverse-feedback .webverse-feedback-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(223, 227, 234, 0.25);
        border-top-color: var(--webverse-feedback-accent, #7aa2ff);
        border-radius: 50%;
        animation: webverse-feedback-spin 0.9s linear infinite;
      }
      @keyframes webverse-feedback-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #webverse-feedback button {
        pointer-events: auto;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--webverse-feedback-fg, #dfe3ea);
        border-radius: 4px;
        padding: 6px 16px;
        cursor: pointer;
      }
    </style>
